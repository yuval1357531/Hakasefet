<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מערכת האש · כל הימים</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/dashboard.css">
<style>
  body { margin: 0; min-height: 100vh; background: #05080f; color: #edf3fb; font-family: var(--font-body, sans-serif); padding: 24px 14px 60px; box-sizing: border-box; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 18px; color: #c9e6ff; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; max-width: 1000px; margin: 0 auto 30px; }
  .cell { border-radius: 14px; border: 1px solid rgba(99,171,255,.22); background: linear-gradient(180deg, #111a2c, #0a101c 60%, #070b14); padding: 8px 8px 12px; display: flex; flex-direction: column; align-items: center; --fire: 130px; }
  .cell b { font-size: 13px; color: #c9e6ff; }
  .master-fire { max-width: 460px; margin: 0 auto; }
</style>
</head>
<body>
  <h1>מערכת האש · ימים 0 עד 70 (70 = העוצמה של המאסטר)</h1>
  <div class="grid" id="grid"></div>
  <h1>כך זה נראה אצל המאסטר (עם הסליידר)</h1>
  <div class="master-fire" id="mf"></div>
<script type="module">
import { fireHTML, wakeFires, masterFireHTML, wireMasterFire } from './js/streak.js';
const days = [0,1,2,3,5,7,10,12,15,20,25,30,35,40,45,50,55,60,70];
const grid = document.getElementById('grid');
grid.innerHTML = days.map((d) => `<div class="cell">${fireHTML(d)}<b>יום ${d}</b></div>`).join('');
wakeFires(grid);
const mf = document.getElementById('mf');
mf.innerHTML = masterFireHTML();
wireMasterFire(mf);
</script>
</body>
</html>
