<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>ice slab 3d</title>
<style>
  html, body { margin: 0; background: #05080f; color: #9ab; font: 12px monospace; }
  canvas { display: block; width: 100%; height: auto; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<!-- Offline 3D render (NOT part of the site): a real slab of ice sitting on a
     lesson button. Physically based transmission (refraction, blur of what is
     behind), bevelled edges reflecting soft boxes, frozen-in air and fractures.
       node tools/flame/render-server.cjs <outDir> 8091  ->  /ice3d.html?capture=1 -->
<script type="module">
import * as THREE from 'three';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const q = new URLSearchParams(location.search);
const ASSET_W = () => (q.get("asset") === "drips" ? 640 : 900), ASSET_H = () => (q.get("asset") === "drips" ? 190 : 450);
const W = ASSET_W(), H = ASSET_H();

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(2);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// ---------- deterministic noise ----------
let seed = 7;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const hash = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
const vnoise = (x, y) => {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
};
const fbm = (x, y, o = 5) => { let s = 0, a = 0.5; for (let i = 0; i < o; i++) { s += a * vnoise(x, y); x = x * 2.03 + 11.7; y = y * 2.03 + 5.3; a *= 0.5; } return s; };

function canvasTex(w, h, fn, srgb = false) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); fn(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.anisotropy = 8; t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

// ---------- environment: dark studio with soft boxes ----------
const envScene = new THREE.Scene();
envScene.background = new THREE.Color(0x0a1220);
const boxes = [
  [0, 9, 4, 22, 3, 0xdff2ff, 14],     // big top strip light
  [-14, 3, 5, 3, 14, 0xbfe4ff, 9],    // left window
  [15, 1, 3, 2.5, 12, 0x9fd0ff, 6],   // right fill
  [0, -8, 6, 24, 2, 0x3a7fb0, 3],     // low cold bounce
  [6, 4, -14, 12, 8, 0x6fb8ff, 3]     // back
];
for (const [x, y, z, w, h, col, k] of boxes) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(col).multiplyScalar(k), side: THREE.DoubleSide }));
  m.position.set(x, y, z); m.lookAt(0, 0, 0); envScene.add(m);
}
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(envScene, 0.02).texture;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04070d);
scene.environment = envTex;

const ASSET = q.get("asset") || "frame";
const WARM = q.get("warm") === "1";
const bgMat = new THREE.MeshBasicMaterial({ color: 0x000000, toneMapped: false });
const back = new THREE.Mesh(new THREE.PlaneGeometry(60, 30), bgMat);
scene.add(back);
const PPU = 100;
const toWorld = (px, py) => [px, py];

// ---------- procedural maps for the ice ----------
// surface relief: slightly wavy, with small rough chips
const bump = canvasTex(1024, 256, (g, w, h) => {
  const im = g.createImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const v = fbm(x * 0.012, y * 0.02, 5) * 0.75 + fbm(x * 0.06, y * 0.06, 3) * 0.25;
    const k = Math.floor(v * 255); const i = (y * w + x) * 4;
    im.data[i] = im.data[i + 1] = im.data[i + 2] = k; im.data[i + 3] = 255;
  }
  g.putImageData(im, 0, 0);
});
// fractures: thin white polylines, branching
function crackTex(n, seedOffset) {
  return canvasTex(1024, 256, (g, w, h) => {
    g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#fff'; g.lineCap = 'round';
    const branch = (x, y, a, len, wd, depth) => {
      g.lineWidth = wd; g.beginPath(); g.moveTo(x, y);
      let cx = x, cy = y;
      for (let i = 0; i < len; i++) {
        a += (rnd() - 0.5) * 0.7;
        cx += Math.cos(a) * 9; cy += Math.sin(a) * 9; g.lineTo(cx, cy);
        if (depth < 2 && rnd() < 0.09) branch(cx, cy, a + (rnd() < 0.5 ? 1 : -1) * (0.5 + rnd() * 0.7), len * 0.4 | 0, wd * 0.6, depth + 1);
      }
      g.stroke();
    };
    for (let i = 0; i < n; i++) branch(w * 0.1 + rnd() * w * 0.8, h * 0.2 + rnd() * h * 0.6, rnd() * 6.28, 14 + (rnd() * 18 | 0), 2.2, 0);
  });
}
const cloudTex = (sd) => canvasTex(512, 128, (g, w, h) => {
  const im = g.createImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const v = Math.pow(Math.max(0, fbm(x * 0.012 + sd, y * 0.03 + sd, 5) - 0.42) * 2.4, 1.4);
    const fe = Math.min(1, Math.min(x, w - x) / (w * 0.12)) * Math.min(1, Math.min(y, h - y) / (h * 0.25)); const k = Math.min(255, Math.floor(v * 255 * fe)); const i = (y * w + x) * 4;
    im.data[i] = im.data[i + 1] = im.data[i + 2] = k; im.data[i + 3] = 255;
  }
  g.putImageData(im, 0, 0);
});

// ---------- one slab ----------
function makeSlab(cx, cy, w, h, d, ready, withIcicles = true) {
  const group = new THREE.Group();
  // a hewn, uneven block: dense box, rounded, then lumpy + sharp chips
  let geo = new THREE.BoxGeometry(w, h, d, Math.round(w * 26), Math.round(h * 26), 12);
  geo.deleteAttribute("uv"); geo.deleteAttribute("normal");
  geo = mergeVertices(geo, 1e-4);
  const p = geo.attributes.position;
  const R0 = 0.26, hx = w / 2, hy = h / 2, hz = d / 2;
  const v3 = (x, y, z, f) => fbm(x * f + z * 3.1 + 7, y * f - z * 2.3 + 2);
  for (let i = 0; i < p.count; i++) {
    let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const ix = Math.max(-hx + R0, Math.min(hx - R0, x)), iy = Math.max(-hy + R0, Math.min(hy - R0, y)), iz = Math.max(-hz + R0, Math.min(hz - R0, z));
    let dx = x - ix, dy = y - iy, dz = z - iz;
    const len = Math.hypot(dx, dy, dz) || 1;
    // inside the rounding band? push to radius R0 and remember the outward direction
    let nx = dx / len, ny = dy / len, nz = dz / len;
    const onShell = len > 1e-5;
    if (onShell) { x = ix + nx * R0; y = iy + ny * R0; z = iz + nz * R0; } else { nx = 0; ny = 0; nz = 1; }
    // broad lumps + ridged sharp chips; stronger toward the outline, gentler on the faces
    const edge = onShell ? Math.min(1, 0.1 + 0.9 * Math.pow(1 - Math.abs(nz), 1.3)) : 0.1;
    const lump = (v3(x, y, z, 0.9) - 0.5) * 0.34 + (v3(x, y, z, 2.6) - 0.5) * 0.12;
    const ridge = Math.pow(Math.abs(v3(x, y, z, 1.5) - 0.5) * 2, 0.55) * 0.11 - 0.05;
    const amt = (lump + ridge) * edge * (ASSET === "frame" ? 0.45 : 1);
    x += nx * amt; y += ny * amt; z += nz * amt * 0.6;
    p.setXYZ(i, x, y, z);
  }
  geo.computeVertexNormals();
  const mat = new THREE.MeshPhysicalMaterial({
    color: ready ? 0xfff2e0 : 0xeaf7ff,
    metalness: 0, roughness: 0.13,
    transmission: 1, thickness: 1.4, ior: 1.31,
    attenuationColor: new THREE.Color(ready ? 0xffc27a : 0xb4e6ff),
    attenuationDistance: ready ? 2.4 : 2.0,
    clearcoat: 1, clearcoatRoughness: 0.06,
    
    specularIntensity: 1, envMapIntensity: 2.1,
    side: THREE.FrontSide, depthWrite: false
  });
  const slab = new THREE.Mesh(geo, mat);
  group.add(slab);
  // icicles hanging from the lower edge, uneven, some thick, some needles
  for (let i = 0; withIcicles && i < 15; i++) {
    const L = (0.3 + Math.pow(rnd(), 1.5) * 1.0) * (ASSET === "frame" ? 0.7 : 1), r0 = 0.09 + rnd() * 0.16;
    const pts = [];
    for (let k = 0; k <= 22; k++) { const t = k / 22; const wob = 1 + 0.18 * Math.sin(t * 9 + i) + 0.08 * Math.sin(t * 23 + i * 2); pts.push(new THREE.Vector2(Math.max(0.004, r0 * Math.pow(1 - t, 0.7) * wob + (t > 0.97 ? 0 : 0.01)), -t * L)); }
    pts.push(new THREE.Vector2(0.0, -L - 0.01));
    const ic = new THREE.Mesh(new THREE.LatheGeometry(pts, 20), mat);
    const ux = -w / 2 + 0.5 + (i + rnd() * 0.8) * ((w - 1.0) / 15);
    ic.position.set(ux, -h / 2 + 0.12 + (rnd() - 0.5) * 0.08, (rnd() - 0.3) * d * 0.55);
    ic.rotation.z = (rnd() - 0.5) * 0.1;
    group.add(ic);
    if (rnd() < 0.4) { const bd = new THREE.Mesh(new THREE.SphereGeometry(0.035, 12, 10), mat); bd.position.set(ic.position.x, ic.position.y - L - 0.07, ic.position.z); group.add(bd); }
  }
  // frozen-in clouds, stacked thin layers (stochastic, drawn in the opaque pass so the glass refracts them)
  for (let i = 0; i < 3; i++) {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(w * 0.9, h * 0.8),
      new THREE.MeshBasicMaterial({ color: ready ? 0xffe9cc : 0xdff3ff, alphaMap: cloudTex(i * 17), transparent: true, depthWrite: false, opacity: ready ? 0.2 : 0.24, side: THREE.DoubleSide, toneMapped: false })
    );
    m.position.z = (i - 1.5) * (d / 5); m.position.x = (rnd() - 0.5) * 0.3; group.add(m);
  }
  // the body scatters light: a faint milky blue fill through the middle
  { const m = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.94, h * 0.86), new THREE.MeshBasicMaterial({ color: ready ? 0xffa850 : 0xa6dcff, transparent: true, opacity: ready ? 0.22 : 0.18, alphaMap: cloudTex(40), depthWrite: false, toneMapped: false })); m.position.z = 0.02; group.add(m); }
  // fractures at a few depths
  for (let i = 0; i < 3; i++) {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(w * 0.92, h * 0.85),
      new THREE.MeshBasicMaterial({ color: ready ? 0xfff4e4 : 0xf3fbff, alphaMap: crackTex(7, i), transparent: true, depthWrite: false, opacity: 0.5, side: THREE.DoubleSide, toneMapped: false })
    );
    m.position.z = (i - 1) * (d / 4.5); m.rotation.y = (rnd() - 0.5) * 0.25; m.rotation.x = (rnd() - 0.5) * 0.12; group.add(m);
  }
  // trapped air bubbles
  const bm = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.05, metalness: 0, clearcoat: 1, envMapIntensity: 2.5, emissive: 0x335577, emissiveIntensity: 0.4 });
  for (let i = 0; i < 34; i++) {
    const r = 0.01 + Math.pow(rnd(), 3) * 0.04;
    const b = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), bm);
    b.position.set((rnd() - 0.5) * (w - 0.9), (rnd() - 0.5) * (h - 0.5), (rnd() - 0.5) * (d - 0.2));
    group.add(b);
  }
  const [wx, wy] = toWorld(cx, cy);
  group.position.set(wx, wy, d / 2 + 0.02);
  scene.add(group);
  return group;
}


const mkMat = (ready) => new THREE.MeshPhysicalMaterial({
  color: ready ? 0xfff2e0 : 0xeaf7ff, metalness: 0, roughness: 0.13, transmission: 1, thickness: 1.4, ior: 1.31,
  attenuationColor: new THREE.Color(ready ? 0xffc27a : 0xb4e6ff), attenuationDistance: ready ? 2.4 : 2.0,
  clearcoat: 1, clearcoatRoughness: 0.06, specularIntensity: 1, envMapIntensity: 2.1, side: THREE.FrontSide, depthWrite: false
});
if (ASSET === "frame") {
  const d = 0.55;
  const g = makeSlab(0, 0, 7.4, 1.7, d, WARM, true);
  g.position.set(0, 0, d / 2 + 0.02);
} else {
  const mat = mkMat(WARM);
  const P = 6.4, N = 9;
  for (let i = 0; i < N; i++) {
    const L = 0.3 + Math.pow(rnd(), 1.5) * 1.0, r0 = 0.09 + rnd() * 0.16;
    const pts = [];
    for (let k = 0; k <= 22; k++) { const t = k / 22; const wob = 1 + 0.18 * Math.sin(t * 9 + i) + 0.08 * Math.sin(t * 23 + i * 2); pts.push(new THREE.Vector2(Math.max(0.004, r0 * Math.pow(1 - t, 0.7) * wob + (t > 0.97 ? 0 : 0.01)), -t * L)); }
    pts.push(new THREE.Vector2(0, -L - 0.01));
    const ic = new THREE.Mesh(new THREE.LatheGeometry(pts, 20), mat);
    ic.position.set(-P / 2 + 0.35 + (i + 0.15 + rnd() * 0.7) * ((P - 0.7) / N), 0.55, rnd() * 0.3);
    ic.rotation.z = (rnd() - 0.5) * 0.1;
    scene.add(ic);
    const root = new THREE.Mesh(new THREE.SphereGeometry(r0 * 1.15, 16, 12), mat);
    root.scale.set(1, 0.55, 1); root.position.copy(ic.position); scene.add(root);
    if (rnd() < 0.4) { const bd = new THREE.Mesh(new THREE.SphereGeometry(0.035, 12, 10), mat); bd.position.set(ic.position.x, ic.position.y - L - 0.07, ic.position.z); scene.add(bd); }
  }
}

const key = new THREE.DirectionalLight(0xffffff, 3.4); key.position.set(-5, 8, 8); scene.add(key);
const rimL = new THREE.PointLight(0x7fc6ff, 40, 30); rimL.position.set(6, -3, 3); scene.add(rimL);
const warmL = new THREE.PointLight(0xffb060, WARM ? 60 : 0, 20); warmL.position.set(0, -0.6, -0.6); scene.add(warmL);

// orthographic-like camera (long lens) with the same downward angle
const camDist = 60, el = Math.atan2(6.6, 20.5);
const cam = new THREE.PerspectiveCamera(2 * Math.atan((H / PPU / 2) / camDist) * 180 / Math.PI, W / H, 1, 300);
const cy0 = ASSET === "frame" ? 0 : -0.45;
cam.position.set(0, cy0 + Math.sin(el) * camDist, Math.cos(el) * camDist);
cam.lookAt(0, cy0, 0.3);
scene.add(cam);

// matte: render over black and over white, solve for alpha + colour
const grab = () => { const c = document.createElement("canvas"); c.width = renderer.domElement.width; c.height = renderer.domElement.height; const g = c.getContext("2d"); g.drawImage(renderer.domElement, 0, 0); return g.getImageData(0, 0, c.width, c.height); };
const draw = (col) => { bgMat.color.set(col); scene.background = new THREE.Color(col); renderer.render(scene, cam); renderer.render(scene, cam); return grab(); };
const A = draw(0x000000), B = draw(0xffffff);
const out = new ImageData(A.width, A.height);
let bx0 = 1e9, bx1 = -1, by0 = 1e9, by1 = -1;
for (let i = 0; i < A.data.length; i += 4) {
  let a = 0;
  for (let c = 0; c < 3; c++) a += 1 - (B.data[i + c] - A.data[i + c]) / 255;
  if (a / 3 > 0.2) { const x = (i / 4) % A.width, y = Math.floor(i / 4 / A.width); if (x < bx0) bx0 = x; if (x > bx1) bx1 = x; if (y < by0) by0 = y; if (y > by1) by1 = y; }
}
// slab geometry is fixed (icicles hang below it): measured once on the plain slab
const SCX = 900, SCY = 449, SHW = 748, SHH = 172;
const BTOP = 348.25, BBOT = 582.6, BCY = (BTOP + BBOT) / 2, BHH = (BBOT - BTOP) / 2, BHW = SHW - 0.2 * 200 - 6;
window.__info = { bx0, bx1, by0, by1, BTOP, BBOT, W: A.width, H: A.height };
for (let i = 0; i < A.data.length; i += 4) {
  let al = 0;
  for (let c = 0; c < 3; c++) al += 1 - (B.data[i + c] - A.data[i + c]) / 255;
  al = Math.max(0, Math.min(1, al / 3));
  for (let c = 0; c < 3; c++) out.data[i + c] = al > 0.003 ? Math.min(255, A.data[i + c] / al) : 0;
  if (ASSET === "frame") {
    const px = (i / 4) % A.width, py = Math.floor(i / 4 / A.width);
    const qx = Math.abs(px - SCX) - BHW + 54, qy = Math.abs(py - BCY) - BHH + 54;
    const sdf = Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - 54;
    const t = Math.max(0, Math.min(1, (sdf + 10) / 14));
    const inside = 1 - t * t * (3 - 2 * t);
    al *= 1 - 0.78 * inside;
    // the rim is a solid block of ice: give it body (frosty blue, denser), keep the 3D highlights on top
    const sx = Math.abs(px - SCX) - SHW + 60, sy = Math.abs(py - SCY) - SHH + 60;
    const sd = Math.hypot(Math.max(sx, 0), Math.max(sy, 0)) + Math.min(Math.max(sx, sy), 0) - 60;
    const sil = 1 - Math.max(0, Math.min(1, (sd + 2) / 6));
    const rimM = sil * (1 - inside);
    const lum = (A.data[i] * 0.3 + A.data[i + 1] * 0.5 + A.data[i + 2] * 0.2) / Math.max(al, 0.05) / 255;
    const bl = Math.min(1.2, 0.7 + 0.55 * lum);
    const base = WARM ? [235 * bl, 170 * bl, 100 * bl] : [105 * bl, 180 * bl, 225 * bl];
    for (let c = 0; c < 3; c++) out.data[i + c] = Math.min(255, out.data[i + c] * (1 - 0.6 * rimM) + base[c] * 0.6 * rimM);
    al = 1 - (1 - al) * (1 - 0.7 * rimM);
  }
  out.data[i + 3] = Math.round(al * 255);
}
const oc = document.createElement("canvas"); oc.width = A.width; oc.height = A.height; oc.getContext("2d").putImageData(out, 0, 0);
document.body.appendChild(oc);
window.__done = true;
if (q.get("capture")) {
  const blob = await new Promise((r) => oc.toBlob(r, "image/png"));
  await fetch("/frame?set=asset_" + ASSET + "_w" + (WARM ? 1 : 0) + "&i=0", { method: "POST", body: blob });
  document.title = "captured";
}
</script>
</body>
</html>
